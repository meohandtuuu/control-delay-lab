[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "control-delay-lab"
version = "0.1.0"
description = "Reproducible experiments for delay in PID position control"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
control-delay-lab = "control_delay_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["control_delay_lab*"]

